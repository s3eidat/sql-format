<body data-tool="sql-format">
<main class="s3-main">
  <section class="s3-hero">
    <h1>SQL Format</h1>
    <p>Beautify or minify SQL queries with readable clauses, joins, CASE blocks and subqueries. Your SQL is only re-spaced, never executed or sent anywhere.</p>
  </section>

  <section class="card stack">
    <div class="row between">
      <h2>Input</h2>
      <div class="row">
        <button class="btn ghost small" id="sample">Sample</button>
        <label class="btn ghost small" id="open">Open file<input type="file" accept=".sql,.txt,text/plain" hidden></label>
        <button class="btn ghost small" id="clear">Clear</button>
      </div>
    </div>
    <label class="field"><span class="sr">SQL input</span>
      <textarea class="textarea" id="input" spellcheck="false" placeholder="Paste SQL here, e.g. select id, name from users where active = 1 order by name"></textarea>
    </label>
    <div class="row sf-opts">
      <label class="field">Keywords
        <select class="select" id="kwcase">
          <option value="upper">UPPER case</option>
          <option value="lower">lower case</option>
          <option value="preserve">Keep as typed</option>
        </select>
      </label>
      <label class="field">Indent
        <select class="select" id="indent">
          <option value="2">2 spaces</option>
          <option value="4">4 spaces</option>
          <option value="tab">Tab</option>
        </select>
      </label>
      <label class="field">Commas
        <select class="select" id="commas">
          <option value="trailing">Trailing  a,</option>
          <option value="leading">Leading  , a</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="keepcom" checked> Keep comments when minifying</label>
    </div>
    <div class="row">
      <button class="btn primary" id="format">Format</button>
      <button class="btn" id="minify">Minify</button>
      <span class="grow"></span>
      <span class="chip" id="status">Waiting for SQL</span>
    </div>
  </section>

  <section class="card stack mt">
    <div class="row between">
      <h2>Output <small id="info"></small></h2>
      <div class="row">
        <button class="btn small" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
        <button class="btn small" id="save"><svg class="i"><use href="#i-download"/></svg>.sql</button>
      </div>
    </div>
    <pre class="out sf-out" id="out" tabindex="0"></pre>
  </section>
</main>
<script src="app.js"></script>
</body>
